name: Build and release extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package Chromium extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, run unit tests and build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Load and test the extension in Chromium
        run: node tests/e2e/smoke.mjs
        env:
          SMOKE_OUT: ${{ runner.temp }}/extension-screenshots

      - name: Save browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-smoke-screenshots
          path: ${{ runner.temp }}/extension-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate extension version
        id: package
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            'Use a numeric package version such as 1.0.1 (no prerelease suffix).');
          const parts = version.split('.').map(Number);
          assert(parts.every(part => part <= 65535) && parts.some(part => part > 0),
            'Chromium version components must be 0–65535 and cannot all be zero.');
          assert.equal(manifest.version, version, 'Manifest and package versions must match.');
          assert.equal(manifest.manifest_version, 3);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `tag=v${version}\narchive=ig-album-downloader-v${version}-chromium.zip\n`);
          NODE

      - name: Create installable ZIP and checksum
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          mkdir -p artifacts
          (cd dist && zip -q -r "../artifacts/$ARCHIVE" .)
          (cd artifacts && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          unzip -t "artifacts/$ARCHIVE"

      - name: Save tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-extension
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish new package version
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      ARCHIVE: ${{ needs.build.outputs.archive }}
    steps:
      - name: Check whether this version is already published
        id: release
        run: |
          error_file="$RUNNER_TEMP/release-lookup-error"
          if release=$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>"$error_file"); then
            if [ "$(jq -r '.draft' <<<"$release")" = false ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is already published; bump package.json to publish another version." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$(jq -r '.target_commitish' <<<"$release")" != "$GITHUB_SHA" ]; then
              echo "An existing draft for $TAG targets another commit; resolve it before retrying." >&2
              exit 1
            fi
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            error=$(cat "$error_file")
            if [[ "$error" != *"HTTP 404"* ]]; then
              cat "$error_file" >&2
              exit 1
            fi
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download tested release files
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromium-extension
          path: artifacts/

      - name: Publish release with installation instructions
        if: steps.release.outputs.publish == 'true'
        env:
          EXISTING_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          (cd artifacts && sha256sum --check "$ARCHIVE.sha256")
          notes_file="$RUNNER_TEMP/extension-release-notes.md"
          cat > "$notes_file" <<EOF
          ## Install in a Chromium browser

          1. Download **$ARCHIVE** from the release assets below.
          2. Extract the ZIP to a permanent folder.
          3. Open \`chrome://extensions\` and enable **Developer mode**.
          4. Click **Load unpacked** and select the extracted folder containing \`manifest.json\`.
          5. Open Instagram while logged in.

          Keep the extracted folder: the browser loads the extension from it.
          To update, extract the next release into that folder and click **Reload** on the extensions page.

          The ZIP contains the built extension, including its local FFmpeg assets.
          EOF
          if [ "$EXISTING_DRAFT" != true ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "IG Album Downloader $TAG" --notes-file "$notes_file" --generate-notes
          fi
          gh release upload "$TAG" "artifacts/$ARCHIVE" "artifacts/$ARCHIVE.sha256" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "Published [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
